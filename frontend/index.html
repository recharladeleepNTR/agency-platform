<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/lazydition_logo.png" />
    <link rel="apple-touch-icon" href="/lazydition_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Lazydition — Creative Editing & Design Team for Creators</title>
    <meta name="description" content="Lazydition is a creative editing and design team working with creators, models, and agencies. Long-form editing, short-form content, thumbnails, and subscription-based platform content." />
    <meta name="keywords" content="video editing, content creation, YouTube editing, TikTok reels, thumbnail design, subscription content, OnlyFans editing, Fansly editing, agency" />
    <meta name="author" content="Lazydition" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lazydition.com/" />
    <meta property="og:title" content="Lazydition — Creative Editing & Design for Creators" />
    <meta property="og:description" content="Content that feels effortless. Results that don't. A friendly creative team for creators, models, and agencies." />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lazydition" />
    <meta name="twitter:title" content="Lazydition — Creative Team for Creators" />
    <meta name="twitter:description" content="Content that feels effortless. Results that don't." />

    <!-- Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Search Engine Indexing & Robots -->
    <link rel="canonical" href="https://lazydition.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Google Structured Data (JSON-LD Schema) for Instant Rich Search Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Lazydition",
      "url": "https://lazydition.com",
      "logo": "https://lazydition.com/lazydition_logo.png",
      "image": "https://lazydition.com/lazydition_logo.png",
      "description": "Lazydition is a creative video editing and visual design team working behind the scenes with creators, models, and agencies.",
      "email": "lazydition@gmail.com",
      "sameAs": [
        "https://www.instagram.com/teamlazydition",
        "https://x.com/lazydition"
      ],
      "areaServed": "Worldwide"
    }
    </script>

    <!-- Theme color -->
    <meta name="theme-color" content="#0E0014" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
