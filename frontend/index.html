<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Standard & Google Search Favicon Specifications -->
    <link rel="icon" href="https://lazydition.com/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="https://lazydition.com/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://lazydition.com/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://lazydition.com/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://lazydition.com/lazydition_logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://lazydition.com/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Lazydition — Creative Editing and Design Team for Creators</title>
    <meta name="description" content="Lazydition is a creative editing and design team working with creators, models, and agencies. Long-form editing, short-form content, thumbnails, and subscription-based platform content." />
    <meta name="keywords" content="video editing, content creation, YouTube editing, TikTok reels, thumbnail design, subscription content, OnlyFans editing, Fansly editing, agency" />
    <meta name="author" content="Lazydition" />

    <!-- Open Graph (Reddit, Facebook, LinkedIn, Discord, WhatsApp, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lazydition.com/" />
    <meta property="og:site_name" content="Lazydition" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Lazydition — Creative Editing and Design for Creators" />
    <meta property="og:description" content="Content that feels effortless. Results that don't. A friendly creative team for creators, models, and agencies." />
    <meta property="og:image" content="https://lazydition.com/lazydition_logo.png" />
    <meta property="og:image:secure_url" content="https://lazydition.com/lazydition_logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Lazydition Logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://lazydition.com/" />
    <meta name="twitter:site" content="@lazydition" />
    <meta name="twitter:creator" content="@lazydition" />
    <meta name="twitter:title" content="Lazydition — Creative Editing and Design for Creators" />
    <meta name="twitter:description" content="Content that feels effortless. Results that don't. A friendly creative team for creators, models, and agencies." />
    <meta name="twitter:image" content="https://lazydition.com/lazydition_logo.png" />

    <!-- Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Search Engine Indexing & Robots -->
    <link rel="canonical" href="https://lazydition.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Google Structured Data (JSON-LD Schema) for Google Search Logo & Site Representation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Lazydition",
      "url": "https://lazydition.com",
      "logo": "https://lazydition.com/lazydition_logo.png",
      "image": "https://lazydition.com/lazydition_logo.png",
      "description": "Lazydition is a creative video editing and visual design team working behind the scenes with creators, models, and agencies.",
      "email": "lazydition@gmail.com",
      "sameAs": [
        "https://www.instagram.com/teamlazydition",
        "https://x.com/lazydition"
      ]
    }
    </script>

    <!-- Theme color -->
    <meta name="theme-color" content="#0E0014" />
  </head>

    <div id="root"></div>
